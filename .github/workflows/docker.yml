name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push our-space-bridge
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            ARK_API_KEY=${{ secrets.ARK_API_KEY }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/our-space-bridge:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/our-space-bridge:${{ github.sha }}

      - name: Build and push weixin-bot
        uses: docker/build-push-action@v6
        with:
          context: ./weixin-bot
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/weixin-bot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/xiayan-weixin-bot:latest

      - name: Build and push weixin-bot-2
        uses: docker/build-push-action@v6
        with:
          context: ./weixin-bot-2
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/weixin-bot-2:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/xiayan-weixin-bot-2:latest

      - name: Build and push weixin-bot-3
        uses: docker/build-push-action@v6
        with:
          context: ./weixin-bot-3
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/weixin-bot-3:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pingguogengbot:latest

      - name: Build and push weixin-bot-4
        uses: docker/build-push-action@v6
        with:
          context: ./weixin-bot-4
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/weixin-bot-4:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/zhimabot:latest

      - name: Build and push weixin-bot-5
        uses: docker/build-push-action@v6
        with:
          context: ./weixin-bot-5
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/weixin-bot-5:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/yunzui:latest
