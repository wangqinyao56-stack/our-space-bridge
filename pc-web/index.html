<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我们的天地 · 电脑端</title>
<style>
  :root {
    --bg: #1A1513;
    --header: #241610;
    --header-text: #F0E0D0;
    --accent: #FF8C42;
    --accent-soft: rgba(255, 140, 66, 0.88);
    --me-bubble: #352A24;
    --me-text: #FFB07A;
    --xiayan-text: #FFFFFF;
    --muted: #9A8474;
    --input-bg: #120D0A;
    --border: rgba(200, 150, 100, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: #E8D5C4;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 连接面板 ── */
  #connectPanel {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; padding: 24px; z-index: 50;
  }
  #connectPanel .logo { font-size: 34px; }
  #connectPanel h1 { font-size: 20px; color: #E8D5C4; font-weight: 600; }
  #connectPanel .field { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 6px; }
  #connectPanel label { font-size: 13px; color: #B8A088; }
  #connectPanel input {
    padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: #2A201A; font-size: 14px; color: #E8D5C4;
  }
  #connectPanel .hint { font-size: 12px; color: var(--muted); text-align: center; max-width: 360px; line-height: 1.6; }
  #connectBtn {
    background: var(--accent); color: #fff; border: none;
    padding: 11px 40px; border-radius: 22px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #connectBtn:hover { opacity: 0.92; }
  #connectError { font-size: 13px; color: #E06050; min-height: 18px; }

  /* ── 主界面 ── */
  #app { display: none; flex: 1; flex-direction: column; height: 100%; }
  #header {
    background: var(--header); color: var(--header-text);
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; user-select: none;
  }
  #header .title { font-size: 16px; font-weight: 600; flex: 1; }
  #statusDot { width: 9px; height: 9px; border-radius: 50%; background: #E06050; }
  #statusDot.on { background: #5BB75B; }
  #statusText { font-size: 12px; color: var(--muted); }
  #settingsBtn {
    background: rgba(255,255,255,0.12); border: none; color: var(--header-text);
    padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }

  #tabs { display: flex; background: var(--header); padding: 0 10px; }
  .tab {
    padding: 8px 16px; font-size: 14px; color: #C8A890; cursor: pointer;
    border-bottom: 2px solid transparent; user-select: none;
  }
  .tab.active { color: var(--header-text); border-bottom-color: var(--accent); font-weight: 600; }

  #messages { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; display: flex; flex-direction: column; }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.xiayan { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.me .bubble { background: var(--me-bubble); color: var(--me-text); border-bottom-right-radius: 4px; }
  .msg.xiayan .bubble { background: var(--accent-soft); color: var(--xiayan-text); border-bottom-left-radius: 4px; }
  .msg .time { font-size: 11px; color: var(--muted); margin-top: 3px; padding: 0 4px; }

  #inputBar {
    background: var(--input-bg); display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px;
  }
  #input {
    flex: 1; resize: none; border: none; border-radius: 12px;
    background: rgba(255,255,255,0.12); color: var(--header-text);
    padding: 10px 12px; font-size: 15px; line-height: 1.5; max-height: 120px;
    font-family: inherit; outline: none;
  }
  #input::placeholder { color: rgba(255,255,255,0.35); }
  #sendBtn {
    background: var(--accent); color: #fff; border: none;
    padding: 10px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.4; cursor: default; }
  #imgBtn {
    background: rgba(255,255,255,0.12); color: var(--header-text); border: none;
    padding: 10px 14px; border-radius: 12px; font-size: 14px; cursor: pointer;
  }
  #imgBtn:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>
  <!-- 连接面板 -->
  <div id="connectPanel">
    <div class="logo">💕</div>
    <h1>我们的天地 · 电脑端</h1>
    <div class="field">
      <label>服务器地址</label>
      <input id="urlInput" type="text" placeholder="wss://siwmhifsvdnu.sealoshzh.site" />
    </div>
    <div class="field">
      <label>密钥（App 里那个 secret）</label>
      <input id="secretInput" type="password" placeholder="OUR_SPACE_SECRET" />
    </div>
    <div class="hint">地址用 wss://（线上）或 ws://192.168.x.x:3456（本地）。连接后消息和手机 App 云端同步。</div>
    <button id="connectBtn">连接</button>
    <div id="connectError"></div>
  </div>

  <!-- 主界面 -->
  <div id="app">
    <div id="header">
      <span id="statusDot"></span>
      <span class="title">我们的天地</span>
      <span id="statusText">连接中…</span>
      <button id="settingsBtn">设置</button>
    </div>
    <div id="tabs">
      <div class="tab active" data-ch="chat">日常聊天</div>
      <div class="tab" data-ch="intimate">亲密空间</div>
    </div>
    <div id="messages"></div>
    <div id="inputBar">
      <button id="imgBtn" title="发送图片">发图</button>
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="sendBtn">发送</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none" />
    </div>
  </div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const messagesEl = $("messages");
  const inputEl = $("input");
  const sendBtn = $("sendBtn");
  const statusDot = $("statusDot");
  const statusText = $("statusText");

  let ws = null;
  let currentChannel = "chat";
  let msgSeq = 0;

  // 本地存储
  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // 初始化连接面板
  $("urlInput").value = store.get("pc_url", "");
  $("secretInput").value = store.get("pc_secret", "");

  function fmtTime(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function addMessage(channel, msg) {
    if (channel !== currentChannel) return; // 只渲染当前 tab
    const from = msg.from === "me" ? "me" : "xiayan";
    const content = msg.content || "";
    const el = document.createElement("div");
    el.className = "msg " + from;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = content;
    el.appendChild(bubble);
    if (msg.timestamp) {
      const t = document.createElement("div");
      t.className = "time";
      t.textContent = fmtTime(msg.timestamp);
      el.appendChild(t);
    }
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function clearMessages() {
    messagesEl.innerHTML = "";
  }

  function setStatus(connected) {
    statusDot.className = connected ? "on" : "";
    statusText.textContent = connected ? "已连接" : "已断开，重连中…";
  }

  function send(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
      return true;
    }
    return false;
  }

  function loadHistory(channel) {
    send({ type: "get_history", channel });
  }

  function sendText() {
    const text = inputEl.value.trim();
    if (!text) return;
    const type = currentChannel === "chat" ? "text" : "intimate_text";
    const id = "pc" + Date.now() + "_" + (++msgSeq);
    // 本地立即显示
    addMessage(currentChannel, { from: "me", type: "text", content: text, timestamp: Date.now() });
    send({ type, id, content: text });
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;
  }

  function connect() {
    const url = $("urlInput").value.trim();
    const secret = $("secretInput").value.trim();
    if (!url || !secret) {
      $("connectError").textContent = "请填写服务器地址和密钥";
      return;
    }
    store.set("pc_url", url);
    store.set("pc_secret", secret);
    $("connectError").textContent = "";
    openWs(url, secret);
  }

  function openWs(url, secret) {
    let u = url;
    if (!/^wss?:\/\//i.test(u)) u = "ws://" + u;
    try { if (ws) { ws.onclose = null; ws.close(); } } catch {}
    try {
      ws = new WebSocket(u);
    } catch (e) {
      $("connectError").textContent = "连接失败：" + e.message;
      return;
    }

    ws.onopen = () => {
      $("connectPanel").style.display = "none";
      $("app").style.display = "flex";
      ws.send(JSON.stringify({ type: "auth", token: secret }));
    };

    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      handle(msg);
    };

    ws.onclose = () => {
      setStatus(false);
      $("connectPanel").style.display = "flex";
      $("app").style.display = "none";
      $("connectError").textContent = "连接断开，可重新连接";
      setTimeout(() => { if (ws && ws.readyState === WebSocket.CLOSED) openWs(url, secret); }, 3000);
    };

    ws.onerror = () => { /* onclose 会处理 */ };
  }

  function handle(msg) {
    switch (msg.type) {
      case "auth_ok":
        setStatus(true);
        loadHistory("chat");
        loadHistory("intimate");
        break;
      case "auth_error":
        $("connectError").textContent = msg.message || "密钥错误";
        break;
      case "history":
        if (msg.channel === currentChannel) {
          clearMessages();
          (msg.messages || []).forEach((m) => addMessage(currentChannel, m));
        }
        break;
      case "text_reply":
        addMessage("chat", { from: "xiayan", content: msg.content, timestamp: Date.now() });
        break;
      case "intimate_reply":
        addMessage("intimate", { from: "xiayan", content: msg.content, timestamp: Date.now() });
        break;
      case "sticker":
        addMessage(msg.reply_to && currentChannel === "chat" ? "chat" : currentChannel, {
          from: "xiayan", content: "[表情 " + (msg.sticker_name || "") + "]", timestamp: Date.now(),
        });
        break;
      case "error":
        // 静默忽略，避免打断
        break;
    }
  }

  // ── 事件绑定 ──
  $("connectBtn").addEventListener("click", connect);
  $("urlInput").addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });
  $("secretInput").addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });
  $("settingsBtn").addEventListener("click", () => {
    try { if (ws) ws.close(); } catch {}
    $("connectPanel").style.display = "flex";
    $("app").style.display = "none";
  });

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      currentChannel = tab.dataset.ch;
      clearMessages();
      loadHistory(currentChannel);
    });
  });

  sendBtn.addEventListener("click", sendText);
  const imgBtn = $("imgBtn");
  const fileInput = $("fileInput");
  imgBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const m = String(reader.result || "").match(/^data:([^;]+);base64,(.*)$/s);
      if (!m) return;
      const id = "pc" + Date.now() + "_" + (++msgSeq);
      addMessage(currentChannel, { from: "me", content: "[图片]", timestamp: Date.now() });
      send({ type: currentChannel === "chat" ? "image" : "intimate_image", id, base64: m[2], mime: m[1] });
    };
    reader.readAsDataURL(file);
    fileInput.value = "";
  });
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendText();
    }
  });
  inputEl.addEventListener("input", () => {
    sendBtn.disabled = !inputEl.value.trim();
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });
})();
</script>
</body>
</html>
