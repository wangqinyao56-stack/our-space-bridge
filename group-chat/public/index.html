<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>相亲相爱一家人</title>
<style>
  :root {
    --bg: #1e1a2e;
    --panel: #2a2440;
    --text: #eae0f5;
    --muted: #a890d0;
    --bubble-bot: #3a2f55;
    --bubble-human: #4a3f6b;
    --accent: #7a5c9e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100%;
  }
  header {
    padding: 14px 16px; background: var(--panel);
    border-bottom: 1px solid rgba(200,184,224,0.15);
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 18px; font-weight: 700; }
  header .sub { font-size: 12px; color: var(--muted); }
  #log {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 82%; padding: 10px 13px; border-radius: 14px; line-height: 1.5; font-size: 15px; }
  .msg .who { font-size: 12px; opacity: 0.75; margin-bottom: 3px; font-weight: 600; }
  .msg.bot { background: var(--bubble-bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.human { background: var(--bubble-human); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.human .who { color: #d0b8e8; }
  .msg.bot .who { color: #8ad0e0; }
  .sys { align-self: center; font-size: 12px; color: var(--muted); }
  footer {
    padding: 10px 12px; background: var(--panel);
    border-top: 1px solid rgba(200,184,224,0.15);
    display: flex; gap: 8px; align-items: center;
  }
  #input {
    flex: 1; padding: 10px 13px; border-radius: 10px; border: 1px solid rgba(200,184,224,0.3);
    background: var(--bg); color: var(--text); font-size: 15px;
  }
  #send {
    padding: 10px 16px; border-radius: 10px; border: none; background: var(--accent);
    color: #fff; font-size: 15px; font-weight: 600;
  }
  #send:active { opacity: 0.8; }
  /* 登录遮罩 */
  #loginMask {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px;
  }
  #loginMask h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  #loginMask p { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 8px; }
  #loginMask input {
    width: 100%; max-width: 320px; padding: 13px 15px; border-radius: 12px;
    border: 1px solid rgba(200,184,224,0.35); background: var(--panel); color: var(--text); font-size: 15px;
  }
  #loginBtn {
    width: 100%; max-width: 320px; padding: 13px; border-radius: 12px; border: none;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 700;
  }
  #loginBtn:active { opacity: 0.85; }
  #loginErr { color: #e8a0a0; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>相亲相爱一家人</h1>
      <div class="sub" id="sub">连接中…</div>
    </div>
  </header>
  <div id="log"></div>
  <footer>
    <input id="input" placeholder="说点什么…" autocomplete="off">
    <button id="send">发送</button>
  </footer>

  <!-- 登录遮罩 -->
  <div id="loginMask">
    <h2>相亲相爱一家人</h2>
    <p id="loginHint">大家的老婆来围观自家夏彦聊天，一起聊</p>
    <input id="nick" placeholder="你的昵称" autocomplete="off" maxlength="20">
    <input id="pass" placeholder="房间密码（没设就不用填）" type="password" style="display:none">
    <button id="loginBtn">进群</button>
    <div id="loginErr"></div>
  </div>

<script>
const log = document.getElementById("log");
const sub = document.getElementById("sub");
const input = document.getElementById("input");
const send = document.getElementById("send");
const loginMask = document.getElementById("loginMask");
const nickInput = document.getElementById("nick");
const passInput = document.getElementById("pass");
const loginBtn = document.getElementById("loginBtn");
const loginErr = document.getElementById("loginErr");

const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
let ws;
let loggedIn = false;

// 记住昵称 + 密码（下次自动进）
const savedNick = localStorage.getItem("groupchat_nick") || "";
const savedPass = localStorage.getItem("groupchat_pass") || "";
if (savedNick) nickInput.value = savedNick;
if (savedPass) passInput.value = savedPass;

function addMsg(m) {
  const div = document.createElement("div");
  div.className = "msg " + (m.role === "human" ? "human" : "bot");
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = m.nickname;
  div.appendChild(who);
  const t = document.createElement("div");
  t.textContent = m.text;
  div.appendChild(t);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function addSys(text) {
  const div = document.createElement("div");
  div.className = "sys";
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { sub.textContent = "已连接"; };
  ws.onclose = () => { sub.textContent = "断开，重连中…"; setTimeout(connect, 3000); };
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === "history") {
      log.innerHTML = "";
      if (msg.bots && msg.bots.length) {
        addSys(`在群里的夏彦：${msg.bots.map(b => b.nickname).join("、")}`);
      }
      (msg.messages || []).forEach(addMsg);
      // 需要密码则显示密码框
      if (msg.needPassword) {
        passInput.style.display = "block";
      }
      // 昵称（+密码）都记住了 → 自动进群，不用每次手输
      if (savedNick && (!msg.needPassword || savedPass)) {
        ws.send(JSON.stringify({ type: "login", nickname: savedNick, password: savedPass }));
      }
    } else if (msg.type === "message") {
      addMsg(msg);
    } else if (msg.type === "login_ok") {
      loggedIn = true;
      loginMask.style.display = "none";
      sub.textContent = "已进群";
    } else if (msg.type === "login_error") {
      loginErr.textContent = msg.message || "登录失败";
    }
  };
}

function doLogin() {
  const nick = nickInput.value.trim();
  if (!nick) { loginErr.textContent = "先填个昵称"; return; }
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: "login", nickname: nick, password: passInput.value }));
    localStorage.setItem("groupchat_nick", nick);
    localStorage.setItem("groupchat_pass", passInput.value);
  }
}

function doSend() {
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== 1 || !loggedIn) return;
  ws.send(JSON.stringify({ type: "chat", text }));
  input.value = "";
}

loginBtn.addEventListener("click", doLogin);
nickInput.addEventListener("keydown", (e) => { if (e.key === "Enter") passInput.style.display === "block" ? passInput.focus() : doLogin(); });
passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
send.addEventListener("click", doSend);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") doSend(); });

connect();
</script>
</body>
</html>
